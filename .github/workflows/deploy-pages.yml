name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/static
          cp -R static/. public/static/
          python - <<'PY'
          from pathlib import Path

          html = Path("templates/index.html").read_text(encoding="utf-8")
          replacements = {
              "{{ url_for('webmanifest') }}": "static/manifest.webmanifest",
              "{{ url_for('static', filename='icon.svg') }}": "static/icon.svg",
              "{{ url_for('static', filename='apple-touch-icon.png') }}": "static/apple-touch-icon.png",
              "{{ url_for('static', filename='style.css') }}?v=50": "static/style.css?v=50",
              "{{ url_for('static', filename='pwa.js') }}?v=1": "static/pwa.js?v=1",
              "../static/style.css?v=50": "static/style.css?v=50",
          }
          for source, target in replacements.items():
              html = html.replace(source, target)
          Path("public/index.html").write_text(html, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
