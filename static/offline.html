<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1116">
    <title>ABT Planner Offline</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
            background: #0d1116;
            color: #f7f9fc;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(380px, 100%);
            padding: 26px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: #171c22;
        }

        p {
            margin: 0;
            color: #aeb8c5;
            line-height: 1.45;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }
    </style>
</head>
<body>
<main>
    <h1>Offline</h1>
    <p>The planner could not reach the server. Reconnect and reopen ABT Planner.</p>
</main>
</body>
</html>
